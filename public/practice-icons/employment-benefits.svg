<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" aria-labelledby="title desc">
<title id="title">Employment and benefits</title><desc id="desc">Employee benefits illustrated by social security, pay raises, achievement awards, meal breaks, perks and bonuses, allowances, health insurance and paid vacation.</desc>
<defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#EAF3FA"/></linearGradient></defs>
<rect x="4" y="5" width="352" height="305" rx="34" fill="#C8DDEB"/><rect x="4" y="1" width="352" height="305" rx="34" fill="url(#panel)" stroke="#B9D0E1" stroke-width="2"/>
<g fill="#155B96" stroke-linecap="round" stroke-linejoin="round">
