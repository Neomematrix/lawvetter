  <text x="79" y="91" fill="#155B96" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="27" letter-spacing="1">CONTRACT</text>
  <path d="M81 111H249" stroke="#FE6B05" stroke-width="4" stroke-linecap="round"/>
