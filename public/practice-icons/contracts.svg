<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="contracts-title contracts-desc">
 <title id="contracts-title">Contracts</title>
 <desc id="contracts-desc">A modern contract document and signing pen in LawVetter blue and orange.</desc>
 <defs>
  <linearGradient id="contract-paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#ECF5FB"/></linearGradient>
  <linearGradient id="contract-pen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2C7CB7"/><stop offset="1" stop-color="#155B96"/></linearGradient>
  <linearGradient id="contract-orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF974C"/><stop offset="1" stop-color="#FE6B05"/></linearGradient>
 </defs>
 <ellipse cx="183" cy="281" rx="141" ry="10" fill="#155B96" opacity=".10"/>
